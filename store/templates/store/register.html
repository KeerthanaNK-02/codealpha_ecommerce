<!-- register.html -->

<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>

        body{
            background-color:black;
            font-family:Arial;
        }

        .box{
            width:350px;
            margin:100px auto;
            background:white;
            padding:40px;
            border-radius:12px;
            text-align:center;
        }

        h2{
            color:orange;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:orange;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:orange;
        }

        a{
            color:orange;
            text-decoration:none;
        }

        .success{
            color:orange;
            font-weight:bold;
            margin-bottom:15px;
        }

        .error{
            color:red;
            font-weight:bold;
            margin-bottom:15px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h2>Register</h2>

        {% if messages %}
            {% for message in messages %}

                <p class="
                    {% if message.tags == 'success' %}
                        success
                    {% else %}
                        error
                    {% endif %}
                ">
                    {{ message }}
                </p>

            {% endfor %}
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <input type="text" name="username" placeholder="Username" required>

            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Register</button>

        </form>

        <br>

        <a href="/login/">Already have an account? Login</a>

    </div>

</body>
</html>
