<!DOCTYPE html>
<html>
<head>
    <title>Cart</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:black;
            color:white;
            transition:0.3s;
        }

        body.dark{
            background:#f5f5f5;
            color:black;
        }

        /* NAVBAR */

        .navbar{
            background:#09111f;
            padding:15px 20px;
            display:flex;
            align-items:center;
        }

        .nav-left{
            width:33%;
        }

        .nav-center{
            width:34%;
            text-align:center;
        }

        .logo{
            font-size:42px;
            font-family:Georgia, serif;
            font-weight:bold;
            color:#ff9900;
            letter-spacing:2px;
        }

        .nav-right{
            width:33%;
            text-align:right;
        }

        .nav-right a{
            color:white;
            text-decoration:none;
            margin-left:15px;
            font-size:18px;
        }

        body.dark .nav-right a{
            color:black;
        }

        #cart-count,
        #wishlist-count{
            background:red;
            color:white;
            padding:2px 6px;
            border-radius:50%;
            font-size:12px;
        }

        .toggle{
            cursor:pointer;
            font-size:28px;
            margin-left:15px;
        }

        /* CART */

        .cart-container{
            width:50%;
            margin:40px auto;
        }

        .cart-title{
            text-align:center;
            font-size:28px;
            margin-bottom:30px;
        }

        .cart-box{
            background:#1b1b1b;
            color:white;
            padding:18px;
            border-radius:10px;
            margin-bottom:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        body.dark .cart-box{
            background:white;
            color:black;
        }

        .remove-btn{
            background:red;
            color:white;
            border:none;
            padding:10px 15px;
            border-radius:6px;
            cursor:pointer;
        }

        .qty-box{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .qty-btn{
            background:#ff9900;
            border:none;
            width:28px;
            height:28px;
            border-radius:50%;
            cursor:pointer;
            font-weight:bold;
        }

        .total{
            text-align:center;
            font-size:22px;
            margin-top:25px;
            font-weight:bold;
        }

        .checkout-btn{
            display:block;
            width:250px;
            margin:30px auto;
            background:green;
            color:white;
            text-align:center;
            padding:15px;
            border-radius:8px;
            text-decoration:none;
            font-size:20px;
        }

        .clear-btn{
            display:block;
            margin:20px auto;
            background:black;
            color:white;
            border:none;
            padding:12px 20px;
            border-radius:6px;
            cursor:pointer;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <!-- LEFT -->

    <div class="nav-left"></div>

    <!-- CENTER -->

    <div class="nav-center">

        <div class="logo">
            Sellora
        </div>

    </div>

    <!-- RIGHT -->

    <div class="nav-right">

        <a href="/">Home</a>

        <a href="/cart">
            Cart (<span id="cart-count">0</span>)
        </a>

        <a href="/wishlist">
            Wishlist (<span id="wishlist-count">0</span>)
        </a>

        <a href="/my-orders">
            My Orders
        </a>

        <span class="toggle" onclick="toggleMode()">🌙</span>

    </div>

</div>

<!-- CART -->

<div class="cart-container">

    <div class="cart-title">
        🛒 Your Cart
    </div>

    <div id="cart-items"></div>

    <div class="total" id="total">
        Total: ₹0
    </div>

    <button class="clear-btn" onclick="clearCart()">
        Clear Cart
    </button>

    <a href="/checkout" class="checkout-btn">
        Proceed to Checkout
    </a>

</div>

<script>

function loadCart(){

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    let cartContainer =
        document.getElementById("cart-items");

    let total = 0;

    cartContainer.innerHTML = "";

    cart.forEach((item,index)=>{

        total += item.price * item.quantity;

        cartContainer.innerHTML += `

        <div class="cart-box">

            <div>
                <b>${item.name}</b>
                - ₹${item.price}
            </div>

            <div class="qty-box">

                <button class="qty-btn"
                        onclick="changeQty(${index},-1)">
                    -
                </button>

                <span>${item.quantity}</span>

                <button class="qty-btn"
                        onclick="changeQty(${index},1)">
                    +
                </button>

                <button class="remove-btn"
                        onclick="removeItem(${index})">
                    Remove
                </button>

            </div>

        </div>

        `;
    });

    document.getElementById("total").innerHTML =
        "Total: ₹" + total;

    updateCounts();
}

function changeQty(index,value){

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    cart[index].quantity += value;

    if(cart[index].quantity <= 0){
        cart.splice(index,1);
    }

    localStorage.setItem("cart",JSON.stringify(cart));

    loadCart();
}

function removeItem(index){

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    cart.splice(index,1);

    localStorage.setItem("cart",JSON.stringify(cart));

    loadCart();
}

function clearCart(){

    localStorage.removeItem("cart");

    loadCart();
}

function updateCounts(){

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    let wishlist =
        JSON.parse(localStorage.getItem("wishlist")) || [];

    let totalQty = 0;

    cart.forEach(item=>{
        totalQty += item.quantity;
    });

    document.getElementById("cart-count").innerText =
        totalQty;

    document.getElementById("wishlist-count").innerText =
        wishlist.length;
}

function toggleMode(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "mode",
        document.body.classList.contains("dark")
    );
}

window.onload = function(){

    loadCart();

    if(localStorage.getItem("mode") === "true"){
        document.body.classList.add("dark");
    }
}

</script>

</body>
</html>
