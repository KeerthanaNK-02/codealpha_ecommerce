<!DOCTYPE html>
<html>
<head>
    <title>Wishlist</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:black;
            color:white;
            transition:0.3s;
        }

        body.dark{
            background:#f5f5f5;
            color:black;
        }

        /* NAVBAR */

        .navbar{
            background:#09111f;
            color:white;
            padding:15px 20px;
            display:flex;
            align-items:center;
        }

        .nav-left{
            width:33%;
        }

        .nav-center{
            width:34%;
            text-align:center;
        }

        .logo{
            font-size:42px;
            font-family:Georgia, serif;
            font-weight:bold;
            color:#ff9900;
            letter-spacing:2px;
        }

        .nav-right{
            width:33%;
            text-align:right;
        }

        .nav-right a{
            color:white;
            margin-left:10px;
            text-decoration:none;
            font-size:17px;
        }

        /* DARK MODE LINK COLOR */

        body.dark .nav-right a{
            color:black;
        }

        .toggle{
            cursor:pointer;
            margin-left:10px;
            font-size:28px;
        }

        /* COUNT BADGES */

        #cart-count,
        #wishlist-count{
            background:red;
            color:white;
            padding:2px 6px;
            border-radius:50%;
            font-size:12px;
        }

        /* TITLE */

        .title{
            text-align:center;
            margin-top:30px;
            font-size:28px;
            font-weight:bold;
        }

        /* WISHLIST */

        .wishlist-container{
            width:40%;
            margin:30px auto;
        }

        .wishlist-box{
            background:#1b1b1b;
            color:white;
            padding:18px;
            border-radius:10px;
            margin-bottom:15px;
            text-align:center;
            font-size:22px;
        }

        body.dark .wishlist-box{
            background:white;
            color:black;
        }

        .empty{
            text-align:center;
            margin-top:30px;
            font-size:20px;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="nav-left"></div>

    <div class="nav-center">

        <div class="logo">
            Sellora
        </div>

    </div>

    <div class="nav-right">

        <a href="/">Home</a>

        | <a href="/cart">
            Cart (<span id="cart-count">0</span>)
          </a>

        | <a href="/wishlist">
            Wishlist (<span id="wishlist-count">0</span>)
          </a>

        | <a href="/my-orders">
            My Orders
          </a>

        <span class="toggle" onclick="toggleMode()">🌙</span>

    </div>

</div>

<!-- TITLE -->

<div class="title">
    ❤️ Your Wishlist
</div>

<!-- WISHLIST ITEMS -->

<div class="wishlist-container" id="wishlist"></div>

<script>

/* LOAD WISHLIST */

let wishlist =
    JSON.parse(localStorage.getItem("wishlist")) || [];

let list =
    document.getElementById("wishlist");

if(wishlist.length === 0){

    list.innerHTML =
        "<div class='empty'>No items in wishlist</div>";

}else{

    wishlist.forEach(item => {

        list.innerHTML += `

            <div class="wishlist-box">

                ${item}

            </div>

        `;
    });
}

/* UPDATE COUNTS */

function updateCounts(){

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    let wishlist =
        JSON.parse(localStorage.getItem("wishlist")) || [];

    let totalQty = 0;

    cart.forEach(item => {

        totalQty += item.quantity || 1;

    });

    document.getElementById("cart-count").innerText =
        totalQty;

    document.getElementById("wishlist-count").innerText =
        wishlist.length;
}

/* DARK MODE */

function toggleMode(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "mode",
        document.body.classList.contains("dark")
    );
}

/* ON LOAD */

window.onload = function(){

    updateCounts();

    if(localStorage.getItem("mode") === "true"){

        document.body.classList.add("dark");
    }
}

</script>

</body>
</html>
