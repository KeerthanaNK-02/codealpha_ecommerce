<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>

    <style>

        body {
            background: black;
            color: white;
        }

        body.dark {
            background: #f5f5f5;
            color: black;
        }

        .item,
        .cart-item,
        .order-box,
        .wishlist-item,
        .checkout-box {
            color: white;
        }

        body.dark .item,
        body.dark .cart-item,
        body.dark .order-box,
        body.dark .wishlist-item,
        body.dark .checkout-box {
            color: black;
        }

        a{
            color:white;
        }

        body.dark a{
            color:black;
        }

        .navbar {
            background: #0f1a26;
            color: white;
            padding: 15px;
            display: flex;
            align-items: center;
        }

        .nav-left {
            width: 33%;
        }

        .nav-center {
            width: 34%;
            text-align: center;
            font-size: 26px;
            font-weight: bold;
        }

        .nav-right {
            width: 33%;
            text-align: right;
        }

        .nav-right a {
            color: white;
            margin-left: 10px;
            text-decoration: none;
        }

        .toggle {
            cursor: pointer;
            margin-left: 10px;
        }

        #cart-count,
        #wishlist-count {
            background: red;
            color: white;
            padding: 2px 6px;
            border-radius: 50%;
            font-size: 12px;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        form {
            width: 340px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
        }

        body.dark form {
            background: #1e1e1e;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .summary {
            margin-top: 15px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            text-align: center;
        }

        body.dark .summary {
            background: #2a2a2a;
        }

        .total {
            font-size: 18px;
            font-weight: bold;
            color: green;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:disabled {
            background: gray;
            cursor: not-allowed;
        }

    </style>
</head>

<body>

<div class="navbar">

    <div class="nav-left"></div>

    <div class="nav-center">
        Sellora
    </div>

    <div class="nav-right">

        <a href="/">Home</a>

        | <a href="/cart">
            Cart (<span id="cart-count">0</span>)
          </a>

        | <a href="/wishlist">
            Wishlist (<span id="wishlist-count">0</span>)
          </a>

        | <a href="/my-orders">My Orders</a>

        <span class="toggle" onclick="toggleMode()">🌙</span>

    </div>

</div>

<h1>🧾 Checkout</h1>

<form method="POST">

    {% csrf_token %}

    <input type="text"
           name="name"
           placeholder="Your Name"
           value="{% if user.is_authenticated %}{{ user.username }}{% endif %}"
           required>

    <textarea name="address"
              placeholder="Address"
              required></textarea>

    <div class="summary">

        Items:
        <span id="item-count">0</span>

        <br>

        <div class="total">

            Total:
            ₹<span id="total-display">0</span>

        </div>

    </div>

    <!-- HIDDEN VALUES -->

    <input type="hidden" name="items" id="items">

    <input type="hidden" name="total" id="total">

    <button type="submit" id="orderBtn">

        Place Order

    </button>

</form>

<script>

/* GET CART */

let cart =
    JSON.parse(localStorage.getItem("cart")) || [];

/* CALCULATE TOTAL */

let total = 0;

cart.forEach(item => {

    total += item.price * item.quantity;

});

/* ITEM NAMES */

let items =
    cart.map(item =>
        item.name + " x" + item.quantity
    ).join(", ");

/* DISPLAY */

document.getElementById("item-count")
    .innerText = cart.length;

document.getElementById("total-display")
    .innerText = total;

/* SEND TO DJANGO */

document.getElementById("items").value = items;

document.getElementById("total").value = total;

/* EMPTY CART CHECK */

if(cart.length === 0){

    document.getElementById("orderBtn")
        .disabled = true;

    document.getElementById("total-display")
        .innerText = "0";

}

/* COUNTS */

function updateCounts(){

    let c =
        JSON.parse(localStorage.getItem("cart")) || [];

    let w =
        JSON.parse(localStorage.getItem("wishlist")) || [];

    let totalQty = 0;

    c.forEach(item => {

        totalQty += item.quantity;

    });

    document.getElementById("cart-count")
        .innerText = totalQty;

    document.getElementById("wishlist-count")
        .innerText = w.length;
}

/* DARK MODE */

function toggleMode(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "mode",
        document.body.classList.contains("dark")
    );
}

/* ON LOAD */

updateCounts();

if(localStorage.getItem("mode") === "true"){

    document.body.classList.add("dark");

}

</script>

</body>
</html>
