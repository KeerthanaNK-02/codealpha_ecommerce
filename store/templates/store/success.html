<!DOCTYPE html>
<html>
<head>
    <title>Order Success</title>

    <style>

        body {
            background: black;
            color: white;
            margin: 0;
            font-family: Arial;
        }

        body.dark {
            background: #f5f5f5;
            color: black;
        }

        a{
            color:white;
        }

        body.dark a{
            color:black;
        }

        /* NAVBAR */

        .navbar {
            background: #0f1a26;
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
        }

        .nav-left {
            width: 33%;
        }

        .nav-center {
            width: 34%;
            text-align: center;
        }

        .logo{
            font-size:42px;
            font-family:Georgia, serif;
            font-weight:bold;
            color:#ff9900;
            letter-spacing:2px;
        }

        .nav-right {
            width: 33%;
            text-align: right;
        }

        .nav-right a {
            color: white;
            margin-left: 10px;
            text-decoration: none;
            font-size:17px;
        }

        body.dark .nav-right a{
            color:black;
        }

        .toggle {
            cursor: pointer;
            margin-left: 10px;
            font-size:28px;
        }

        /* COUNT */

        #cart-count,
        #wishlist-count {
            background: red;
            color: white;
            padding: 2px 6px;
            border-radius: 50%;
            font-size: 12px;
        }

        /* SUCCESS BOX */

        .success-container{
            display:flex;
            justify-content:center;
            align-items:center;
            height:80vh;
        }

        .success-box{
            background:white;
            color:black;
            padding:40px;
            border-radius:12px;
            text-align:center;
            width:350px;
            box-shadow:0 0 10px rgba(0,0,0,0.3);
        }

        body.dark .success-box{
            background:#1e1e1e;
            color:white;
        }

        .success-box h1{
            color:green;
            margin-bottom:15px;
        }

        .btn{
            display:inline-block;
            margin-top:20px;
            text-decoration:none;
            background:#ff9900;
            color:white !important;
            padding:12px 20px;
            border-radius:5px;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="nav-left"></div>

    <div class="nav-center">

        <div class="logo">
            Sellora
        </div>

    </div>

    <div class="nav-right">

        <a href="/">Home</a>

        | <a href="/cart">
            Cart (<span id="cart-count">0</span>)
        </a>

        | <a href="/wishlist">
            Wishlist (<span id="wishlist-count">0</span>)
        </a>

        | <a href="/my-orders">
            My Orders
        </a>

        <span class="toggle"
              onclick="toggleMode()">
              🌙
        </span>

    </div>

</div>

<!-- SUCCESS MESSAGE -->

<div class="success-container">

    <div class="success-box">

        <h1>✅ Order Placed Successfully!</h1>

        <p>
            Thank you for your purchase 🎉
        </p>

        <a href="/" class="btn">
            Continue Shopping
        </a>

    </div>

</div>

<script>

/* CLEAR CART */

localStorage.removeItem("cart");

/* UPDATE COUNTS */

function updateCounts(){

    let c =
        JSON.parse(localStorage.getItem("cart")) || [];

    let w =
        JSON.parse(localStorage.getItem("wishlist")) || [];

    document.getElementById("cart-count")
        .innerText = c.length;

    document.getElementById("wishlist-count")
        .innerText = w.length;
}

/* DARK MODE */

function toggleMode(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "mode",
        document.body.classList.contains("dark")
    );
}

/* ON LOAD */

updateCounts();

if(localStorage.getItem("mode") === "true"){

    document.body.classList.add("dark");
}

</script>

</body>
</html>
