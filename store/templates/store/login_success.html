<!DOCTYPE html>
<html>
<head>
    <title>Login Success</title>

    <style>

        body{
            margin:0;
            background:black;
            font-family:Arial;
            color:white;
        }

        .navbar{
            background:#09111f;
            padding:20px;
            text-align:center;
        }

        .logo{
            color:#ff9900;
            font-size:40px;
            font-family:Georgia;
            font-weight:bold;
        }

        .box{
            width:450px;
            margin:100px auto;
            background:#111;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 0 15px rgba(255,153,0,0.3);
        }

        h1{
            color:#00cc44;
            margin-bottom:20px;
        }

        p{
            font-size:20px;
        }

        .btn{
            display:inline-block;
            margin-top:25px;
            padding:12px 30px;
            background:#ff9900;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-size:18px;
        }

        .btn:hover{
            background:#ff9900;
        }

    </style>
</head>

<body>

<div class="navbar">

    <div class="logo">Sellora</div>

</div>

<div class="box">

    <h1>✅ Login Successful!</h1>

    <p>Welcome back to Sellora 🎉</p>

    <a href="/" class="btn">

        Go To Store

    </a>

</div>

</body>
</html>
