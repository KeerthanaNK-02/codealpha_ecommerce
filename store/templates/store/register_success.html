<!DOCTYPE html>
<html>
<head>
    <title>Registration Successful</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:black;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .success-box{
            background:white;
            width:420px;
            padding:40px;
            border-radius:18px;
            text-align:center;
            box-shadow:0 4px 18px rgba(0,0,0,0.3);
        }

        .success-icon{
            font-size:60px;
            margin-bottom:15px;
        }

        h1{
            color:#28a745;
            margin-bottom:15px;
        }

        p{
            font-size:18px;
            color:#444;
            margin-bottom:30px;
        }

        a{
            display:inline-block;
            background:#ff9900;
            color:white;
            padding:12px 28px;
            border-radius:8px;
            text-decoration:none;
            font-size:16px;
            font-weight:bold;
        }

        a:hover{
            background:#e68a00;
        }

    </style>
</head>

<body>

<div class="success-box">

    <div class="success-icon">
        🎉
    </div>

    <h1>Registration Successful!</h1>

    <p>
        Your account has been created successfully.
    </p>

    <a href="/login">
        Login Now
    </a>

</div>

</body>
</html>
