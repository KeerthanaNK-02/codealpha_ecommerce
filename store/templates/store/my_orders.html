<!DOCTYPE html>
<html>
<head>
    <title>My Orders</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:black;
            color:white;
            transition:0.3s;
        }

        body.dark{
            background:#f5f5f5;
            color:black;
        }

        /* NAVBAR */

        .navbar{
            background:#09111f;
            color:white;
            padding:15px 20px;
            display:flex;
            align-items:center;
        }

        .nav-left{
            width:33%;
        }

        .nav-center{
            width:34%;
            text-align:center;
        }

        .logo{
            font-size:42px;
            font-family:Georgia, serif;
            font-weight:bold;
            color:#ff9900;
            letter-spacing:2px;
        }

        .nav-right{
            width:33%;
            text-align:right;
        }

        .nav-right a{
            color:white;
            margin-left:10px;
            text-decoration:none;
            font-size:17px;
        }

        /* DARK MODE LINK COLOR */

        body.dark .nav-right a{
            color:black;
        }

        .toggle{
            cursor:pointer;
            margin-left:10px;
            font-size:28px;
        }

        /* COUNT BADGES */

        #cart-count,
        #wishlist-count{
            background:red;
            color:white;
            padding:2px 6px;
            border-radius:50%;
            font-size:12px;
        }

        /* TITLE */

        .title{
            text-align:center;
            margin-top:30px;
            font-size:30px;
            font-weight:bold;
        }

        /* ORDERS */

        .orders-container{
            width:45%;
            margin:30px auto;
        }

        .order-box{
            background:#1b1b1b;
            color:white;
            padding:22px;
            border-radius:12px;
            margin-bottom:20px;
        }

        body.dark .order-box{
            background:white;
            color:black;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        .order-header{
            font-size:24px;
            font-weight:bold;
            color:#ff9900;
            margin-bottom:15px;
        }

        .order-box p{
            margin:10px 0;
            font-size:18px;
        }

        .total{
            color:green;
            font-size:24px;
            font-weight:bold;
            margin-top:15px;
        }

        .empty{
            text-align:center;
            margin-top:40px;
            font-size:22px;
        }

    </style>
</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

    <div class="nav-left"></div>

    <div class="nav-center">

        <div class="logo">
            Sellora
        </div>

    </div>

    <div class="nav-right">

        <a href="/">Home</a>

        | <a href="/cart">
            Cart (<span id="cart-count">0</span>)
          </a>

        | <a href="/wishlist">
            Wishlist (<span id="wishlist-count">0</span>)
          </a>

        | <a href="/my-orders">
            My Orders
          </a>

        <span class="toggle" onclick="toggleMode()">🌙</span>

    </div>

</div>

<!-- TITLE -->

<div class="title">
    🧾 My Orders
</div>

<!-- ORDERS -->

<div class="orders-container">

{% for order in orders %}

    <div class="order-box">

        <div class="order-header">
            Order #{{ forloop.counter }}
        </div>

        <p>
            <b>Name:</b>
            {{ order.name }}
        </p>

        <p>
            <b>Address:</b>
            {{ order.address }}
        </p>

        <p>
            <b>Items:</b>
            {{ order.items }}
        </p>

        <p class="total">
            Total: ₹{{ order.total }}
        </p>

    </div>

{% empty %}

    <div class="empty">
        No orders yet 🛒
    </div>

{% endfor %}

</div>

<script>

/* UPDATE COUNTS */

function updateCounts(){

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    let wishlist =
        JSON.parse(localStorage.getItem("wishlist")) || [];

    let totalQty = 0;

    cart.forEach(item => {

        totalQty += item.quantity || 1;

    });

    document.getElementById("cart-count").innerText =
        totalQty;

    document.getElementById("wishlist-count").innerText =
        wishlist.length;
}

/* DARK MODE */

function toggleMode(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "mode",
        document.body.classList.contains("dark")
    );
}

/* ON LOAD */

window.onload = function(){

    updateCounts();

    if(localStorage.getItem("mode") === "true"){

        document.body.classList.add("dark");
    }
}

</script>

</body>
</html>
